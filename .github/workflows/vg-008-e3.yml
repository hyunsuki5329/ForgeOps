name: VG-008 E3 Verification

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: vg-008-e3-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_ref: ${{ steps.identity.outputs.image_ref }}
      image_digest: ${{ steps.identity.outputs.image_digest }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      workflow_ref: ${{ steps.identity.outputs.workflow_ref }}
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
    steps:
      - name: Assert protected default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_ALLOWED: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true }}
        run: |
          set -euo pipefail
          test "$REF_ALLOWED" = "true"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compute fixed image package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          repository_lower="${GITHUB_REPOSITORY,,}"
          image_name="ghcr.io/${repository_lower}-e3"
          test "$image_name" = "${image_name,,}"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build and push fixed probe image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: tools/sandbox_security/e3_image/Dockerfile
          push: true
          tags: ${{ steps.package.outputs.image_name }}:${{ github.sha }}
          provenance: false

      - name: Seal build outputs
        id: identity
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.package.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="$IMAGE_NAME@$IMAGE_DIGEST"
          [[ "$image_ref" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*-e3@sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_ref=refs/heads/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$GITHUB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.0.6'

      - name: Sign exact digest
        shell: bash
        env:
          IMAGE_REF: ${{ steps.identity.outputs.image_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"

  verify-e3:
    needs: build-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GITHUB_EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FORGEOPS_E3_IMAGE_REF: ${{ needs.build-sign.outputs.image_ref }}
      FORGEOPS_E3_IMAGE_DIGEST: ${{ needs.build-sign.outputs.image_digest }}
    steps:
      - name: Assert protected run and sealed outputs
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_ALLOWED: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true }}
          SOURCE_SHA: ${{ needs.build-sign.outputs.source_sha }}
          WORKFLOW_REF: ${{ needs.build-sign.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ needs.build-sign.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REF_ALLOWED" = "true"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$WORKFLOW_REF" = "$GITHUB_REF"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$WORKFLOW_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[0-9]+$ ]]
          [[ "$FORGEOPS_E3_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          expected_image="ghcr.io/${GITHUB_REPOSITORY,,}-e3@$FORGEOPS_E3_IMAGE_DIGEST"
          test "$FORGEOPS_E3_IMAGE_REF" = "$expected_image"

      - name: Check out signed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.build-sign.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.0.6'

      - name: Log in to GHCR read-only
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify digest identity before provisioning
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/vg-008-e3.yml@refs/heads/$DEFAULT_BRANCH"
          cosign verify --certificate-identity "$certificate_identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$FORGEOPS_E3_IMAGE_REF"

      - name: Install rootless Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          prerequisite_fail() {
            printf '%s\n' "$1" >&2
            exit "$2"
          }
          docker_key_temp="$(mktemp)" || prerequisite_fail "E3_ROOTLESS_KEY_DOWNLOAD_FAILED" 47
          docker_repository_temp="$(mktemp)" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          cleanup_prerequisites() {
            rm -f -- "$docker_key_temp" "$docker_repository_temp"
          }
          trap cleanup_prerequisites EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://download.docker.com/linux/ubuntu/gpg \
            --output "$docker_key_temp" || prerequisite_fail "E3_ROOTLESS_KEY_DOWNLOAD_FAILED" 47
          docker_key_listing="$(gpg --batch --show-keys --with-colons --with-fingerprint "$docker_key_temp")" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          docker_primary_pub_count="$(printf '%s\n' "$docker_key_listing" | awk -F: '$1 == "pub" { count += 1 } END { print count + 0 }')" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          docker_primary_fingerprints="$(
            printf '%s\n' "$docker_key_listing" | awk -F: '
              $1 == "pub" { awaiting_primary_fpr = 1; next }
              $1 == "sub" { awaiting_primary_fpr = 0; next }
              awaiting_primary_fpr && $1 == "fpr" { print $10; awaiting_primary_fpr = 0 }
            '
          )" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          docker_primary_fingerprint_count="$(printf '%s\n' "$docker_primary_fingerprints" | awk 'NF { count += 1 } END { print count + 0 }')" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          test "$docker_primary_pub_count" = "1" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          test "$docker_primary_fingerprint_count" = "1" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          test "$docker_primary_fingerprints" = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88" || prerequisite_fail "E3_ROOTLESS_KEY_FINGERPRINT_MISMATCH" 48
          sudo install -m 0755 -d /etc/apt/keyrings || prerequisite_fail "E3_ROOTLESS_KEYRING_INSTALL_FAILED" 49
          sudo install -m 0644 "$docker_key_temp" /etc/apt/keyrings/docker.asc || prerequisite_fail "E3_ROOTLESS_KEYRING_INSTALL_FAILED" 49
          architecture="$(dpkg --print-architecture)" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          test "$architecture" = "amd64" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          test -r /etc/os-release || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          . /etc/os-release
          test "${ID:-}" = "ubuntu" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          test "${VERSION_ID:-}" = "24.04" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          test "${VERSION_CODENAME:-}" = "noble" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          printf 'Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' "$VERSION_CODENAME" "$architecture" > "$docker_repository_temp" || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          sudo install -m 0644 "$docker_repository_temp" /etc/apt/sources.list.d/docker.sources || prerequisite_fail "E3_ROOTLESS_REPOSITORY_CONFIG_INVALID" 50
          sudo apt-get update || prerequisite_fail "E3_ROOTLESS_REPOSITORY_UPDATE_FAILED" 51
          docker_version="$(dpkg-query --show --showformat='${Version}' docker-ce-cli)" || prerequisite_fail "E3_ROOTLESS_DOCKER_CLI_VERSION_UNAVAILABLE" 40
          uidmap_version="$(apt-cache policy uidmap | awk '/Candidate:/ { print $2; exit }')" || prerequisite_fail "E3_ROOTLESS_UIDMAP_VERSION_UNAVAILABLE" 41
          rootless_version="$(apt-cache madison docker-ce-rootless-extras | awk -v expected="$docker_version" '$3 == expected { print $3; exit }')" || prerequisite_fail "E3_ROOTLESS_EXTRAS_VERSION_MISMATCH" 42
          [[ "$docker_version" =~ ^[0-9A-Za-z.+:~_-]+$ ]] || prerequisite_fail "E3_ROOTLESS_DOCKER_CLI_VERSION_UNAVAILABLE" 40
          [[ "$uidmap_version" =~ ^[0-9A-Za-z.+:~_-]+$ ]] || prerequisite_fail "E3_ROOTLESS_UIDMAP_VERSION_UNAVAILABLE" 41
          test "$rootless_version" = "$docker_version" || prerequisite_fail "E3_ROOTLESS_EXTRAS_VERSION_MISMATCH" 42
          sudo apt-get install --yes --no-install-recommends "uidmap=$uidmap_version" "docker-ce-rootless-extras=$docker_version" || prerequisite_fail "E3_ROOTLESS_PACKAGE_INSTALL_FAILED" 43
          command -v dockerd-rootless-setuptool.sh >/dev/null || prerequisite_fail "E3_ROOTLESS_PACKAGE_INSTALL_FAILED" 43
          command -v newuidmap >/dev/null || prerequisite_fail "E3_ROOTLESS_PACKAGE_INSTALL_FAILED" 43
          command -v newgidmap >/dev/null || prerequisite_fail "E3_ROOTLESS_PACKAGE_INSTALL_FAILED" 43
          runner_uid="$(id -u)"
          test "$runner_uid" -ne 0 || prerequisite_fail "E3_ROOTLESS_USER_SESSION_FAILED" 44
          export XDG_RUNTIME_DIR="/run/user/$runner_uid"
          sudo loginctl enable-linger "$(id -un)" || prerequisite_fail "E3_ROOTLESS_USER_SESSION_FAILED" 44
          sudo systemctl start "user@$runner_uid.service" || prerequisite_fail "E3_ROOTLESS_USER_SESSION_FAILED" 44
          test "$(stat -c %u "$XDG_RUNTIME_DIR")" = "$runner_uid" || prerequisite_fail "E3_ROOTLESS_RUNTIME_DIR_INVALID" 45
          test -S "$XDG_RUNTIME_DIR/bus" || prerequisite_fail "E3_ROOTLESS_USER_BUS_MISSING" 46
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Configure rootless Docker
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sandbox_security/setup_rootless.sh
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          test "$(docker info --format '{{.CgroupVersion}} {{.CgroupDriver}}')" = "2 systemd"

      - name: Pull exact digest
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          docker pull "$FORGEOPS_E3_IMAGE_REF"
          docker image inspect "$FORGEOPS_E3_IMAGE_REF" --format '{{json .RepoDigests}}' | grep -Fq "$FORGEOPS_E3_IMAGE_REF"

      - name: Collect fixed runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          python tools/sandbox_security/e3_helper.py

      - name: Sign public attestation blob
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle artifacts/runtime/e3-attestation.bundle.json artifacts/runtime/e3-attestation.json

      - name: Verify and import signed attestation
        shell: bash
        run: |
          set -euo pipefail
          python tools/sandbox_security/e3_attestation.py import

      - name: Run exact Phase 0 and W9 union gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/foundation_conformance/verify.py --manifest fixtures/forgeops-foundation/source-manifest.json --suite fixtures/forgeops-foundation/suite.json --result artifacts/verification/vg-001-protocol-conformance-result.json --command-id protocol-conformance
          python tools/foundation_conformance/verify.py --manifest fixtures/forgeops-foundation/source-manifest.json --suite fixtures/forgeops-foundation/suite.json --result artifacts/verification/vg-001-sample-fixture-result.json --command-id sample-fixture
          python tools/contract_bridge/verify.py --schema contracts/product-task-contract/1.0/schema.json --suite fixtures/product-task-contract-bridge/suite.json --result artifacts/verification/vg-002-contract-bridge-result.json --report artifacts/reviews/w1-contract-bridge-checkpoint.html
          python tools/state_contract/verify.py --schema contracts/forgeops-state-contract/1.0/schema.json --suite fixtures/forgeops-state-contract/state-suite.json --result artifacts/verification/vg-003-state-transition-result.json --command-id state-transition-fixture
          python tools/state_contract/verify.py --schema contracts/forgeops-state-contract/1.0/schema.json --suite fixtures/forgeops-state-contract/state-suite.json --result artifacts/verification/vg-003-event-order-result.json --command-id event-order-fixture
          python tools/replay_contract/verify.py --schema contracts/forgeops-replay-contract/1.0/schema.json --suite fixtures/forgeops-replay-contract/suite.json --result artifacts/verification/vg-003-replay-contract-result.json
          python tools/interface_contract/verify.py --openapi contracts/forgeops-api/1.0/openapi.yaml --event-schema contracts/forgeops-event/1.0/schema.json --manifest-schema contracts/forgeops-run-manifest/1.0/schema.json --api-version-suite fixtures/forgeops-api/version-envelope-suite.json --api-boundary-suite fixtures/forgeops-api/data-control-suite.json --event-suite fixtures/forgeops-event-contract/suite.json --manifest-suite fixtures/forgeops-run-manifest/suite.json --result artifacts/verification/vg-004-interface-contract-result.json --command-id interface-contract-fixture
          python tools/policy_contract/verify.py resource --schema contracts/forgeops-authority-policy/1.0/schema.json --suite fixtures/forgeops-authority-resource/suite.json --result artifacts/verification/vg-005-resource-authority-result.json --command-id resource-authority-negative
          python tools/policy_contract/verify.py resource --schema contracts/forgeops-authority-policy/1.0/schema.json --suite fixtures/forgeops-authority-resource/suite.json --result artifacts/verification/vg-005-protected-read-result.json --command-id protected-read-negative
          python tools/policy_contract/verify.py command-network --schema contracts/forgeops-authority-policy/1.0/schema.json --suite fixtures/forgeops-authority-command-network/suite.json --result artifacts/verification/vg-006-command-network-result.json --command-id command-network-negative
          python tools/policy_contract/verify.py approval --schema contracts/forgeops-authority-policy/1.0/schema.json --suite fixtures/forgeops-approval-policy/suite.json --result artifacts/verification/vg-007-approval-policy-result.json --command-id approval-negative-fixture
          python tools/sandbox_security/verify.py --schema contracts/forgeops-sandbox-contract/1.0/schema.json --suite fixtures/forgeops-sandbox-security/suite.json --runtime-profile artifacts/runtime/sandbox-runtime-profile.json --runtime docker --result artifacts/verification/vg-008-image-provenance-result.json --command-id image-provenance-negative
          python tools/sandbox_security/verify.py --schema contracts/forgeops-sandbox-contract/1.0/schema.json --suite fixtures/forgeops-sandbox-security/suite.json --runtime-profile artifacts/runtime/sandbox-runtime-profile.json --runtime docker --result artifacts/verification/vg-008-containment-egress-result.json --command-id containment-egress-negative
          python tools/sandbox_security/verify.py --schema contracts/forgeops-sandbox-contract/1.0/schema.json --suite fixtures/forgeops-sandbox-security/suite.json --runtime-profile artifacts/runtime/sandbox-runtime-profile.json --runtime docker --result artifacts/verification/vg-008-teardown-result.json --command-id teardown-negative
          python tools/secret_artifact_security/verify.py --schema contracts/forgeops-secret-artifact-contract/1.0/schema.json --suite fixtures/forgeops-secret-artifact-security/suite.json --result artifacts/verification/vg-009-secret-surface-result.json --command-id secret-surface-negative
          python tools/secret_artifact_security/verify.py --schema contracts/forgeops-secret-artifact-contract/1.0/schema.json --suite fixtures/forgeops-secret-artifact-security/suite.json --result artifacts/verification/vg-009-artifact-isolation-result.json --command-id artifact-isolation-negative
          python tools/snapshot_context/verify.py snapshot-baseline --snapshot-schema contracts/forgeops-snapshot-contract/1.0/schema.json --context-schema contracts/forgeops-context-pack/1.0/schema.json --suite fixtures/forgeops-snapshot-baseline/suite.json --result artifacts/verification/vg-010-snapshot-identity-result.json --command-id snapshot-identity
          python tools/snapshot_context/verify.py snapshot-baseline --snapshot-schema contracts/forgeops-snapshot-contract/1.0/schema.json --context-schema contracts/forgeops-context-pack/1.0/schema.json --suite fixtures/forgeops-snapshot-baseline/suite.json --result artifacts/verification/vg-010-baseline-retrieval-result.json --command-id baseline-retrieval-repeat
          python tools/snapshot_context/verify.py context --snapshot-schema contracts/forgeops-snapshot-contract/1.0/schema.json --context-schema contracts/forgeops-context-pack/1.0/schema.json --suite fixtures/forgeops-context-security/suite.json --result artifacts/verification/vg-011-context-provenance-result.json --command-id context-provenance
          python tools/snapshot_context/verify.py context --snapshot-schema contracts/forgeops-snapshot-contract/1.0/schema.json --context-schema contracts/forgeops-context-pack/1.0/schema.json --suite fixtures/forgeops-context-security/suite.json --result artifacts/verification/vg-011-injection-negative-result.json --command-id injection-negative
          python tools/local_vertical/verify.py --schema contracts/forgeops-local-vertical/1.0/schema.json --product-schema contracts/product-task-contract/1.0/schema.json --snapshot-schema contracts/forgeops-snapshot-contract/1.0/schema.json --context-schema contracts/forgeops-context-pack/1.0/schema.json --suite fixtures/forgeops-local-vertical/suite.json --result artifacts/verification/vg-012-local-vertical-result.json --command-id main-part-work-main
          python tools/patch_verification/verify.py --schema contracts/forgeops-patch-verification/1.0/schema.json --suite fixtures/forgeops-patch-verification/suite.json --result artifacts/verification/vg-013-task-checks-result.json --command-id task-checks
          python tools/patch_verification/verify.py --schema contracts/forgeops-patch-verification/1.0/schema.json --suite fixtures/forgeops-patch-verification/suite.json --result artifacts/verification/vg-013-regression-checks-result.json --command-id regression-checks
          python tools/patch_verification/verify.py --schema contracts/forgeops-patch-verification/1.0/schema.json --suite fixtures/forgeops-patch-verification/suite.json --result artifacts/verification/vg-013-verification-anti-tamper-result.json --command-id verification-anti-tamper
          python tools/lifecycle_trace/verify.py --schema contracts/forgeops-lifecycle-trace/1.0/schema.json --suite fixtures/forgeops-lifecycle-trace/suite.json --result artifacts/verification/vg-014-budget-cancel-result.json --command-id budget-cancel-negative
          python tools/lifecycle_trace/verify.py --schema contracts/forgeops-lifecycle-trace/1.0/schema.json --suite fixtures/forgeops-lifecycle-trace/suite.json --result artifacts/verification/vg-014-no-progress-result.json --command-id no-progress-stop
          python tools/lifecycle_trace/verify.py --schema contracts/forgeops-lifecycle-trace/1.0/schema.json --suite fixtures/forgeops-lifecycle-trace/suite.json --result artifacts/verification/vg-015-trace-manifest-result.json --command-id trace-manifest-completeness
          python tools/lifecycle_trace/verify.py --schema contracts/forgeops-lifecycle-trace/1.0/schema.json --suite fixtures/forgeops-lifecycle-trace/suite.json --result artifacts/verification/vg-015-external-write-result.json --command-id external-write-negative
          python tools/evidence_contract/verify.py --schema contracts/forgeops-evidence-contract/1.0/schema.json --suite fixtures/forgeops-evidence-contract/suite.json --result artifacts/verification/vg-023-evidence-contract-result.json --command-id evidence-positive-negative
          python tools/evidence_contract/verify.py --schema contracts/forgeops-evidence-contract/1.0/schema.json --suite fixtures/forgeops-evidence-contract/suite.json --result artifacts/verification/vg-023-extension-provenance-result.json --command-id extension-provenance
          python tools/phase_exit/verify.py --schema contracts/forgeops-phase-exit-contract/1.0/schema.json --suite fixtures/forgeops-phase-exit/phase-0-suite.json --result artifacts/verification/phase-0-exit-result.json --report artifacts/reviews/phase-0-exit-report.md --command-id phase0-exit-gate

      - name: Require 18 of 18 READY
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/verification/phase-0-exit-result.json").read_text(encoding="utf-8"))
          expected = {"required": 18, "passed": 18, "failed": 0, "not_run": 0, "blocked": 0}
          if result.get("status") != "READY" or result.get("summary") != expected or result.get("blockers") != []:
              raise SystemExit(2)
          PY

      - name: Run W9 safety reducers and gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase1_safety/verify.py --schema contracts/forgeops-phase1-safety/1.0/schema.json --suite fixtures/forgeops-phase1-safety/suite.json --result artifacts/verification/phase-1-security-negative-result.json --command-id phase1-security-negative
          python tools/phase1_safety/verify.py --schema contracts/forgeops-phase1-safety/1.0/schema.json --suite fixtures/forgeops-phase1-safety/suite.json --result artifacts/verification/phase-1-evidence-freshness-result.json --command-id phase1-evidence-freshness
          python tools/phase1_safety/verify.py --schema contracts/forgeops-phase1-safety/1.0/schema.json --suite fixtures/forgeops-phase1-safety/suite.json --result artifacts/verification/phase-1-safety-gate-result.json --report-md artifacts/reviews/phase-1-safety-scorecard.md --report-html artifacts/reviews/phase-1-safety-scorecard.html --command-id phase1-safety-gate

      - name: Build closed W9 public manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/sandbox_security/e3_artifact.py build-phase1

      - name: Stage exact W9 public artifact tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/sandbox_security/e3_artifact.py stage-phase1-upload

      - name: Upload public W9 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forgeops-phase1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase1-upload
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
